<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>WiFi Vault</title>
<style>
  :root {
    --bg: #0f1117; --card: #181b24; --line: #262a36;
    --text: #e8eaf0; --muted: #8b90a0; --accent: #4f8cff; --ok: #3ecf8e; --warn: #f5b84b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 22px 24px 12px; }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #banner {
    display: none; margin: 0 24px 12px; padding: 10px 14px; border-radius: 10px;
    background: rgba(245,184,75,.12); border: 1px solid var(--warn); color: var(--warn); font-size: 13px;
  }
  .toolbar { display: flex; gap: 10px; padding: 0 24px 14px; }
  input {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    color: var(--text); padding: 10px 14px; border-radius: 10px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #list { flex: 1; overflow-y: auto; padding: 0 24px 16px; display: grid; gap: 10px; align-content: start; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: flex; align-items: center; gap: 14px;
  }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pw { font-family: Consolas, monospace; font-size: 14px; margin-top: 8px; word-break: break-all; }
  .note { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .note.warn { color: var(--warn); }
  .actions { display: flex; gap: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { padding: 10px 24px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  .copied { border-color: var(--ok) !important; color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>WiFi Vault</h1>
  <div class="sub">Wi-Fi networks saved on this PC</div>
</header>
<div id="banner">
  Not running as Administrator, so some passwords may be hidden.
  Close the app and reopen it with "Run as administrator" (or start it from an Administrator terminal).
</div>
<div class="toolbar">
  <input id="search" placeholder="Search networks..." />
  <button id="toggleAll">Show all</button>
  <button id="refresh" class="primary">Refresh</button>
</div>
<div id="list"></div>
<footer id="count"></footer>

<script>
  let networks = [];
  const revealed = new Set();
  let allShown = false;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const NOTES = {
    open: { text: 'Open network: it has no password.', warn: false },
    enterprise: { text: 'Enterprise network (WPA-Enterprise): it signs in with a username/password or certificate, so there is no shared Wi-Fi password to show.', warn: false },
    unreadable: { text: 'Could not read this password. Try running as Administrator. On a work or school PC, an administrator policy may also block it.', warn: true },
  };

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const shown = networks.filter((n) => n.name.toLowerCase().includes(q));
    $('count').textContent = `${shown.length} of ${networks.length} networks`;

    if (!shown.length) {
      $('list').innerHTML = '<div class="empty">No networks found.</div>';
      return;
    }

    $('list').innerHTML = shown.map((n) => {
      const hasPw = n.status === 'ok';
      const visible = allShown || revealed.has(n.name);
      let body;
      if (hasPw) {
        body = `<div class="pw">${visible ? esc(n.password) : '••••••••••'}</div>`;
      } else {
        const note = NOTES[n.status];
        body = `<div class="note ${note.warn ? 'warn' : ''}">${note.text}</div>`;
      }
      return `
        <div class="item">
          <div class="info">
            <div class="name">${esc(n.name)}</div>
            <div class="meta">${esc(n.security || 'Unknown security')}</div>
            ${body}
          </div>
          ${hasPw ? `<div class="actions">
            <button data-act="toggle" data-name="${esc(n.name)}">${visible ? 'Hide' : 'Show'}</button>
            <button data-act="copy" data-name="${esc(n.name)}">Copy</button>
          </div>` : ''}
        </div>`;
    }).join('');
  }

  $('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const net = networks.find((n) => n.name === btn.dataset.name);
    if (!net) return;

    if (btn.dataset.act === 'toggle') {
      revealed.has(net.name) ? revealed.delete(net.name) : revealed.add(net.name);
      render();
    } else if (btn.dataset.act === 'copy') {
      await navigator.clipboard.writeText(net.password);
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
    }
  });

  $('toggleAll').addEventListener('click', () => {
    allShown = !allShown;
    $('toggleAll').textContent = allShown ? 'Hide all' : 'Show all';
    render();
  });

  $('search').addEventListener('input', render);
  $('refresh').addEventListener('click', load);

  async function load() {
    $('list').innerHTML = '<div class="empty">Loading...</div>';
    const result = await window.api.getNetworks();
    networks = result.networks;
    $('banner').style.display = result.admin ? 'none' : 'block';
    render();
  }

  load();
</script>
</body>
</html>
